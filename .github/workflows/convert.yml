name: Convert to DietPi

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "SmartPi-armbian release tag to use as base (empty = latest release)"
        required: false
        default: ""
      artifact_filter:
        description: "Base image filter"
        required: false
        default: "smartpi1-trixie-debian13-server"
      dietpi_owner:
        description: "DietPi repo owner"
        required: false
        default: "MichaIng"
      dietpi_branch:
        description: "DietPi repo branch"
        required: false
        default: "master"
      hw_model:
        description: "DietPi hardware model ID (25 = Generic Allwinner H3)"
        required: false
        default: "25"

jobs:
  check:
    name: Resolve base release
    runs-on: ubuntu-latest
    outputs:
      base_tag: ${{ steps.check.outputs.base_tag }}
    steps:
      - name: Resolve base release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          if [[ -z "${TAG}" ]]; then
            TAG=$(gh release view --repo Yumi-Lab/SmartPi-armbian --json tagName --jq .tagName)
          fi
          echo "base_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Base release: ${TAG}"

  convert:
    name: Convert to DietPi (base ${{ needs.check.outputs.base_tag }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    needs: check
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support xz-utils parted zerofree

      - name: Download base image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work && cd work
          TAG="${{ needs.check.outputs.base_tag }}"
          FILTER="${{ github.event.inputs.artifact_filter }}"
          FILTER="${FILTER:-smartpi1-trixie-debian13-server}"
          echo "Base release: ${TAG} — filter: ${FILTER}"
          gh release download "${TAG}" --repo Yumi-Lab/SmartPi-armbian \
            --pattern "*${FILTER}*.img.xz"
          ls -la

      - name: Extract image
        run: |
          cd work
          IMG_XZ=$(ls *.img.xz | head -n1)
          echo "Base image: ${IMG_XZ}"
          unxz -T0 "${IMG_XZ}"
          IMG=$(ls *.img | head -n1)
          echo "IMG=${IMG}" >> "$GITHUB_ENV"
          ls -la

      - name: Grow image (+2G for the conversion)
        run: |
          cd work
          truncate -s +2G "${IMG}"
          # Root partition = last partition of the MBR table
          ROOTPART=$(sudo parted -sm "${IMG}" unit s print | tail -n1 | cut -d: -f1)
          echo "Root partition number: ${ROOTPART}"
          sudo parted -s "${IMG}" resizepart "${ROOTPART}" 100%
          echo "ROOTPART=${ROOTPART}" >> "$GITHUB_ENV"

      - name: Mount image
        run: |
          cd work
          LOOP=$(sudo losetup -fP --show "${IMG}")
          echo "Loop device: ${LOOP}"
          echo "LOOP=${LOOP}" >> "$GITHUB_ENV"
          lsblk "${LOOP}"
          sudo e2fsck -fy "${LOOP}p${ROOTPART}" || true
          sudo resize2fs "${LOOP}p${ROOTPART}"
          sudo mkdir -p /mnt/img
          sudo mount "${LOOP}p${ROOTPART}" /mnt/img
          # FAT boot partition, if the image has one
          if [[ "${ROOTPART}" != "1" ]]; then
            sudo mount "${LOOP}p1" /mnt/img/boot
          fi
          df -h /mnt/img /mnt/img/boot || true

      - name: Prepare chroot
        run: |
          sudo cp /usr/bin/qemu-arm-static /mnt/img/usr/bin/
          sudo mount --bind /dev /mnt/img/dev
          sudo mount --bind /dev/pts /mnt/img/dev/pts
          sudo mount -t proc proc /mnt/img/proc
          sudo mount -t sysfs sys /mnt/img/sys
          sudo mount -t tmpfs tmpfs /mnt/img/tmp
          # Armbian's resolv.conf is a symlink into /run (systemd-resolved),
          # dangling inside the chroot — replace it with a real file
          sudo rm -f /mnt/img/etc/resolv.conf
          printf 'nameserver 1.1.1.1\nnameserver 9.9.9.9\n' | sudo tee /mnt/img/etc/resolv.conf > /dev/null
          sudo cp install.sh /mnt/img/install.sh
          sudo chmod +x /mnt/img/install.sh

      - name: Run DietPi installer in chroot
        run: |
          sudo chroot /mnt/img /usr/bin/env \
            GITOWNER="${{ github.event.inputs.dietpi_owner }}" \
            GITBRANCH="${{ github.event.inputs.dietpi_branch }}" \
            HW_MODEL="${{ github.event.inputs.hw_model }}" \
            DISTRO_TARGET=8 \
            WIFI_REQUIRED=0 \
            bash /install.sh

      - name: Cleanup chroot
        if: always()
        run: |
          sudo rm -f /mnt/img/install.sh /mnt/img/usr/bin/qemu-arm-static
          sudo umount -l /mnt/img/tmp /mnt/img/sys /mnt/img/proc /mnt/img/dev/pts /mnt/img/dev 2>/dev/null || true
          if mountpoint -q /mnt/img/boot; then sudo umount /mnt/img/boot; fi
          sudo umount /mnt/img || true

      - name: Shrink image
        run: |
          cd work
          PART="${LOOP}p${ROOTPART}"
          sudo e2fsck -fy "${PART}"
          # Shrink the filesystem to its minimum, then add a ~200 MB margin;
          # DietPi re-expands to the full SD card on first boot.
          sudo resize2fs -M "${PART}"
          BSIZE=$(sudo dumpe2fs -h "${PART}" 2>/dev/null | awk '/^Block size:/{print $3}')
          BCOUNT=$(sudo dumpe2fs -h "${PART}" 2>/dev/null | awk '/^Block count:/{print $3}')
          MARGIN=$(( 200 * 1024 * 1024 / BSIZE ))
          TARGET=$(( BCOUNT + MARGIN ))
          sudo resize2fs "${PART}" "${TARGET}"
          # Zero the remaining free blocks so xz can compress them away
          sudo zerofree "${PART}" || true
          sudo e2fsck -fy "${PART}"
          # Rewrite the partition entry to the new size and cut the file
          START_S=$(sudo parted -sm "${IMG}" unit s print | awk -F: -v p="${ROOTPART}" '$1==p {gsub("s","",$2); print $2}')
          SIZE_S=$(( TARGET * BSIZE / 512 ))
          sudo losetup -d "${LOOP}"
          echo "${START_S},${SIZE_S}" | sudo sfdisk --force -N "${ROOTPART}" "${IMG}"
          # Armbian tags the FAT /boot partition as MBR type 0xEA, which
          # macOS/Windows refuse to probe — retag it as FAT32 LBA (0x0C) so
          # dietpi.txt can be edited from any computer, like official
          # DietPi images.
          if [[ "${ROOTPART}" != "1" ]]; then
            sudo sfdisk --force --part-type "${IMG}" 1 c
          fi
          truncate -s $(( (START_S + SIZE_S) * 512 )) "${IMG}"
          ls -la --block-size=M "${IMG}"

      - name: Rename and compress
        run: |
          cd work
          DATE=$(date -u +%Y-%m-%d-%H%M)
          # Follow the OS builder naming convention:
          # {Vendor}-{board}-{codename}-{distro}-{variant}-{timestamp}
          BASE=$(basename "${IMG}" .img)
          OUT=$(echo "${BASE}" | sed -E "s/-server-[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]{4}$/-dietpi-${DATE}/")
          if [[ "${OUT}" == "${BASE}" ]]; then
            OUT="Yumi-smartpi1-trixie-debian13-dietpi-${DATE}"
          fi
          mv "${IMG}" "${OUT}.img"
          xz -efvzT0 "${OUT}.img"
          sha256sum "${OUT}.img.xz" > "${OUT}.img.xz.sha256"
          echo "OUT=${OUT}" >> "$GITHUB_ENV"
          ls -la

      - name: Upload DietPi image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUT }}.img.xz
          path: work/${{ env.OUT }}.img.xz

      - name: Upload checksum
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUT }}.img.xz.sha256
          path: work/${{ env.OUT }}.img.xz.sha256

      - name: Publish as release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.check.outputs.base_tag }}"
          if gh release view "${TAG}" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "Release ${TAG} exists — uploading assets"
          else
            gh release create "${TAG}" \
              --title "DietPi ${TAG}" \
              --notes "DietPi image converted from SmartPi-armbian ${TAG} (base: ${{ github.event.inputs.artifact_filter || 'smartpi1-trixie-debian13-server' }})." \
              --repo "${{ github.repository }}"
          fi
          gh release upload "${TAG}" work/${{ env.OUT }}.img.xz work/${{ env.OUT }}.img.xz.sha256 \
            --clobber --repo "${{ github.repository }}"
